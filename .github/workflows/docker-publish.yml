name: Docker Publish

on:
  push:
    branches:
      - dsv4-a6000-opt
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in in_progress queued; do
            gh run list -R ${{ github.repository }} -w "${{ github.workflow }}" \
              --status $status --json databaseId -q '.[].databaseId'
          done | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              gh run cancel "$id" -R ${{ github.repository }} || true
            fi
          done

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "8.6"
            tags: lazymio/vllm-backport:latest-sm86,lazymio/vllm-backport:latest
          - arch: "8.0"
            tags: lazymio/vllm-backport:latest-sm80
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af
          df -h

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: lazymio
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          push: true
          tags: ${{ matrix.tags }}
          build-args: |
            torch_cuda_arch_list=${{ matrix.arch }}
            max_jobs=2
            nvcc_threads=4
